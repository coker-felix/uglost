services:
  server:
    build: ./server
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      DATABASE_PATH: /data/uglost.sqlite
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 5
      CLIENT_ORIGIN: "*"
    volumes:
      - uglost-data:/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5050/api
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  uglost-data:
